name: Build KernelSU boot.img for Redmi K30 5G (picasso)

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'Stock boot.img URL'
        required: true
        default: 'https://github.com/yunlian001/resukisu-picasso/releases/download/boot-img/picasso-stock-boot.img'
      kernel_branch:
        description: 'Kernel source branch'
        required: true
        default: 'picasso-r-oss'
      config_source:
        description: "Config source: 'stock' = repo configs/stock_picasso_perf.config (dumped from device /proc/config.gz); 'defconfig' = use the defconfig target below"
        required: true
        default: 'stock'
      defconfig:
        description: 'defconfig make target (only used when config_source=defconfig)'
        required: true
        default: 'vendor/lito-perf_defconfig'
      ksu_enable:
        description: 'Integrate KernelSU (true/false)'
        required: true
        default: 'false'
      ksu_version:
        description: 'KernelSU version tag (only used when ksu_enable=true)'
        required: false
        default: 'v0.9.5'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache bc bison flex libssl-dev libncurses-dev \
            device-tree-compiler u-boot-tools lz4 zstd python3 curl wget unzip zip cpio kmod \
            libelf-dev rsync make gcc

      - name: Fetch AOSP R-era toolchain (clang-r383902 + android-4.9)
        run: |
          git clone --depth 1 -b 11.0.1 https://github.com/picasso09/clang-11.0.1-r383902.git $HOME/clang
          git clone --depth 1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git $HOME/gcc64
          git clone --depth 1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git $HOME/gcc32
          $HOME/clang/bin/clang --version | head -2
          $HOME/gcc64/bin/aarch64-linux-android-gcc --version | head -1
          $HOME/gcc64/bin/aarch64-linux-android-as --version | head -1

      - name: Clone kernel source
        run: |
          git clone --depth 1 -b ${{ inputs.kernel_branch }} https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Integrate KernelSU ${{ inputs.ksu_version }} (only when ksu_enable=true)
        if: ${{ inputs.ksu_enable == 'true' }}
        run: |
          cd kernel
          git config user.email "ci@local" && git config user.name "ci"
          # bash -s passes the version tag so setup.sh checks out exactly this version
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/${{ inputs.ksu_version }}/kernel/setup.sh" | bash -s ${{ inputs.ksu_version }}
          cd KernelSU && git describe --tags && cd ..

      - name: Build kernel
        run: |
          set -eo pipefail
          cd kernel
          export PATH="$HOME/clang/bin:$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ccache -M 5G || true
          COMMON_ARGS="O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            HOSTCFLAGS=-fcommon"
          mkdir -p out
          if [ "${{ inputs.config_source }}" = "stock" ]; then
            # Use the exact perf config dumped from the running stock kernel (/proc/config.gz)
            cp "$GITHUB_WORKSPACE/configs/stock_picasso_perf.config" out/.config
            echo "Base config: device stock perf config ($(grep -c '=y' out/.config) =y items)"
          else
            make $COMMON_ARGS ${{ inputs.defconfig }}
            # focaltech_core.c unconditionally references fod_* fields gated by CONFIG_TOUCHSCREEN_FTS_FOD
            echo "CONFIG_TOUCHSCREEN_FTS_FOD=y" >> out/.config
          fi
          # KernelSU options injected into .config before olddefconfig resolves them
          if [ "${{ inputs.ksu_enable }}" = "true" ]; then
            echo "CONFIG_KSU=y" >> out/.config
            echo "CONFIG_KALLSYMS=y" >> out/.config
            echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          fi
          make $COMMON_ARGS olddefconfig
          # ---- Config-loss audit: stock =y symbols that did not survive into this source tree ----
          if [ "${{ inputs.config_source }}" = "stock" ]; then
            grep '=y$' "$GITHUB_WORKSPACE/configs/stock_picasso_perf.config" | sed 's/=y$//' | sort > /tmp/stock_y.txt
            grep '=y$' out/.config | sed 's/=y$//' | sort > /tmp/new_y.txt
            comm -23 /tmp/stock_y.txt /tmp/new_y.txt > /tmp/missing_y.txt || true
            cp out/.config "$GITHUB_WORKSPACE/final.config"
            cp /tmp/missing_y.txt "$GITHUB_WORKSPACE/missing_y.txt"
            echo "=== stock =y count: $(wc -l < /tmp/stock_y.txt), new =y count: $(wc -l < /tmp/new_y.txt), missing: $(wc -l < /tmp/missing_y.txt) ==="
            echo "=== boot-critical symbols present in new .config ==="
            grep -E 'CONFIG_(SCSI_UFS_QCOM|SCSI_UFSHCD|ARM_SMMU|PINCTRL_LITO|QCOM_RPMH|QCOM_SCM=|QCOM_SMEM|REGULATOR_QCOM_RPMH|INTERCONNECT|COMMON_CLK_QCOM|SYNAPTICS_TCM|TOUCHSCREEN_SYNAPTICS_DSX_CORE)=' out/.config || true
          fi
          if [ "${{ inputs.ksu_enable }}" = "true" ]; then
            grep -q "^CONFIG_KSU=y" out/.config || { echo "FATAL: CONFIG_KSU is not set"; exit 1; }
            grep "^CONFIG_KSU" out/.config
          fi
          make $COMMON_ARGS -j"$(nproc)" 2>&1 | tee build.log
          if [ "${{ inputs.ksu_enable }}" = "true" ]; then
            KSU_OBJS=$(find out -path "*kernelsu*" -name "*.o" | head -20)
            echo "KSU objects: $KSU_OBJS"
            test -n "$KSU_OBJS" || { echo "FATAL: no kernelsu objects built"; exit 1; }
          fi
          echo "=== boot dir ==="
          find out/arch/arm64/boot -maxdepth 1 -type f -printf '%f  %s bytes\n' | sort

      - name: Upload resolved config audit
        if: ${{ inputs.config_source == 'stock' }}
        uses: actions/upload-artifact@v4
        with:
          name: config-audit
          path: |
            final.config
            missing_y.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log

      - name: Download stock boot.img
        run: |
          curl -L --retry 3 -o stock-boot.img "${{ inputs.boot_img_url }}"
          ls -la stock-boot.img

      - name: Repack boot.img with new kernel
        run: |
          set -eo pipefail
          curl -L --retry 3 -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -o magisk.apk 'lib/x86_64/libmagiskboot.so' -d magisk_tmp
          cp magisk_tmp/lib/x86_64/libmagiskboot.so magiskboot && chmod +x magiskboot
          mkdir -p boot_work && cd boot_work
          ../magiskboot unpack ../stock-boot.img
          KERNEL=""
          for f in Image.gz-dtb Image-dtb Image.gz Image; do
            if [ -f "../kernel/out/arch/arm64/boot/$f" ]; then KERNEL="../kernel/out/arch/arm64/boot/$f"; break; fi
          done
          test -n "$KERNEL"
          echo "Using kernel image: $KERNEL"
          cp "$KERNEL" kernel
          ../magiskboot repack ../stock-boot.img ../boot-ksu.img
          cd .. && ls -la boot-ksu.img

      - name: Compute artifact name
        id: artname
        run: |
          if [ "${{ inputs.config_source }}" = "stock" ]; then base="stockcfg"; else base=$(echo "${{ inputs.defconfig }}" | tr / _); fi
          ksustr="nosu"
          if [ "${{ inputs.ksu_enable }}" = "true" ]; then ksustr="ksu"; fi
          echo "name=boot-${base}-${ksustr}" >> "$GITHUB_OUTPUT"

      - name: Upload boot-ksu.img
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artname.outputs.name }}
          path: boot-ksu.img
