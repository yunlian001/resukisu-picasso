name: Build KernelSU boot.img for Redmi K30 5G (picasso)

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'Stock boot.img URL'
        required: true
        default: 'https://github.com/yunlian001/resukisu-picasso/releases/download/boot-img/picasso-stock-boot.img'
      kernel_src:
        description: 'Kernel source repo'
        required: true
        default: 'https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git'
      kernel_branch:
        description: 'Kernel source branch'
        required: true
        default: 'picasso-r-oss'
      ksu_version:
        description: 'KernelSU version tag'
        required: true
        default: 'v0.9.5'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache bc bison flex libssl-dev libncurses-dev \
            device-tree-compiler u-boot-tools lz4 zstd python2 python3 curl wget unzip zip cpio kmod \
            libelf-dev dwarves pahole rsync \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu

      - name: Clone kernel source
        run: |
          git clone --depth 1 -b ${{ inputs.kernel_branch }} ${{ inputs.kernel_src }} kernel

      - name: Integrate KernelSU ${{ inputs.ksu_version }}
        run: |
          cd kernel
          git config user.email "ci@local" && git config user.name "ci"
          git apply --whitespace=fix ../patches/resukisu-hooks.patch
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/${{ inputs.ksu_version }}/kernel/setup.sh" | bash
          # Make gcc-wrapper.py a pure passthrough (do not fail or delete objects on GCC 11+ warnings)
          sed -i 's/^[[:space:]]\+interpret_warning(line)/            pass/' scripts/gcc-wrapper.py
          # Disable all -Werror in Makefiles (old kernel + GCC 11 has many false positives)
          find . -name "Makefile" -exec sed -i 's/-Werror[-a-z=]*//g' {} +
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/picasso_user_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/vendor/picasso_user_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y" >> arch/arm64/configs/vendor/picasso_user_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y" >> arch/arm64/configs/vendor/picasso_user_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y" >> arch/arm64/configs/vendor/picasso_user_defconfig
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/vendor/picasso_user_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/vendor/picasso_user_defconfig

      - name: Build kernel
        run: |
          cd kernel
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ccache -M 5G
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error=strict-prototypes -Wno-strict-prototypes -Wno-error" PYTHON=python2 vendor/picasso_user_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error=strict-prototypes -Wno-strict-prototypes -Wno-error" PYTHON=python2 -j$(nproc) 2>&1 | tee build.log
          ls -la out/arch/arm64/boot/

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log

      - name: Download stock boot.img
        run: |
          curl -L -o stock-boot.img "${{ inputs.boot_img_url }}"
          ls -la stock-boot.img

      - name: Repack boot.img with new kernel
        run: |
          curl -L -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v28.1/app-release.apk
          unzip -o magisk.apk 'lib/x86_64/libmagiskboot.so' -d magisk_tmp
          cp magisk_tmp/lib/x86_64/libmagiskboot.so magiskboot && chmod +x magiskboot
          ./magiskboot | head -2
          mkdir -p boot_work && cd boot_work
          ../magiskboot unpack ../stock-boot.img
          KERNEL=$(ls ../kernel/out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || ls ../kernel/out/arch/arm64/boot/Image.gz 2>/dev/null || echo ../kernel/out/arch/arm64/boot/Image)
          cp $KERNEL kernel
          ../magiskboot repack ../stock-boot.img ../boot-ksu.img
          cd .. && ls -la boot-ksu.img

      - name: Upload boot-ksu.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-ksu-picasso
          path: boot-ksu.img
